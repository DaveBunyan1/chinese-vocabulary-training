name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Run Quality Checks (Ruff & Mypy)
        run: |
          cd backend
          ruff check .
          ruff format --check .
          mypy src

      - name: Run Test Suite via Makefile
        run: |
          cd backend
          make test
