services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chinese
      POSTGRES_PASSWORD: chinese
      POSTGRES_DB: chinese_learning_test
    ports:
      - "5433:5432"
    networks:
      - test-chinese-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chinese -d chinese_learning_test"]
      interval: 2s
      timeout: 5s
      retries: 10

networks:
  test-chinese-network:
    driver: bridge
