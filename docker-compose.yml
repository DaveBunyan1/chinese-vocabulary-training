# Local full-stack development.
# Usage: docker compose up --build
#
# Frontend:  http://localhost:3000  (nginx; proxies /api → backend)
# Backend:   http://localhost:8000  (FastAPI + reload)
# Postgres:  localhost:5432

services:
  db:
    image: postgres:16-alpine
    container_name: chinese_learning_db
    restart: always
    environment:
      POSTGRES_USER: chinese
      POSTGRES_PASSWORD: chinese
      POSTGRES_DB: chinese_learning
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chinese -d chinese_learning"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chinese_learning_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      PORT: "8000"
      LOG_LEVEL: DEBUG
      DATABASE_URL: postgresql+asyncpg://chinese:chinese@db:5432/chinese_learning
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Live-reload application code during development
      - ./backend/src:/app/src
    command: >
      uvicorn chinese_learning.app:app
      --host 0.0.0.0
      --port 8000
      --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chinese_learning_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
