services:
  db:
    image: postgres:16-alpine
    container_name: chinese_learning_db
    restart: always
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: chinese_learning_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d chinese_learning_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chinese_learning_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - LOG_LEVEL=DEBUG
      - DATABASE_URL=postgresql+asyncpg://dev_user:secret_password@db:5432/chinese_learning_dev
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src # Live reload code during development

volumes:
  postgres_data:
