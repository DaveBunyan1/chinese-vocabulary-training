[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chinese-learning"
version = "0.1.0"
description = "Backend domain service for Chinese Learning Platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # API Layer
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",

    # Database & ORM
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Observability & Logging
    "structlog>=24.1.0",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",

    # Utilities
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

# --- Tooling Configurations ---

# 1. Ruff (Linter + Formatter)
[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]
extend-exclude = [
    "migrations/versions"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (modernize syntax)
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # Line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"**/conftest.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["chinese_learning"]

# 2. Mypy (Strict Static Type Checking)
[tool.mypy]
python_version = "3.14"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["jieba.*", "pypinyin.*"]
ignore_missing_imports = true

# 3. Pytest Configuration
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers --cov=chinese_learning --cov-report=term-missing"
markers = [
    "unit: Pure fast unit tests (no DB or external I/O)",
    "integration: Tests requiring DB adapters or external libraries",
    "e2e: End-to-end HTTP API tests",
]

# 4. Coverage
[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "migrations/*", "*/__init__.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/chinese_learning"]